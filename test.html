<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テキスト読み上げ</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; }
    textarea { width: 100%; height: 120px; font-size: 16px; margin-bottom: 15px; }
    button { padding: 12px 24px; font-size: 16px; border-radius: 8px; border: none; background: #007aff; color: #fff; }
  </style>
</head>
<body>
  <h2>音声読み上げ</h2>
  <textarea id="text" placeholder="読み上げたい文字を入力">こんにちは！iPhoneでテキストを読み上げています。</textarea>
  <br>
  <button id="speakBtn">読み上げる</button>

  <script>
    const btn = document.getElementById('speakBtn');
    const textInput = document.getElementById('text');

    btn.addEventListener('click', () => {
      const text = textInput.value;
      if (!text) return;

      // 既存の音声をキャンセルして新規作成
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP'; // 日本語指定
      uttr.rate = 1.0;    // 速度 (0.1〜10)

      window.speechSynthesis.speak(uttr);
    });
  </script>
</body>
</html>
